name: CI/CD to ECS Fargate

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        run: |
          BACKEND_IMAGE=${{ secrets.ECR_REGISTRY }}/${{ secrets.ECR_REPO_BACKEND }}:latest
          echo "Building and pushing backend image: $BACKEND_IMAGE"

          docker buildx build \
            --platform linux/amd64 \
            --no-cache \
            -f Dockerfile.backend \
            -t $BACKEND_IMAGE \
            --push \
            .

      - name: Build and push frontend image
        run: |
          FRONTEND_IMAGE=${{ secrets.ECR_REGISTRY }}/${{ secrets.ECR_REPO_FRONTEND }}:latest
          echo "Building and pushing frontend image: $FRONTEND_IMAGE"

          docker buildx build \
            --platform linux/amd64 \
            --no-cache \
            -f Dockerfile.frontend \
            -t $FRONTEND_IMAGE \
            --push \
            .

      - name: Force new ECS deployment
        run: |
          aws ecs update-service \
            --cluster "${{ secrets.ECS_CLUSTER }}" \
            --service "${{ secrets.ECS_SERVICE }}" \
            --force-new-deployment \
            --region "${{ secrets.AWS_REGION }}"
